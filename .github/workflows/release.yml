name: Publish signed Chinese release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version like 1.4.1-zh.2 (never reuse an existing release tag)"
        required: true
        default: "1.4.1-zh.2"
        type: string
  push:
    branches: [zh-CN]
    paths:
      - ".release/TRIGGER_SIGNED_RELEASE.txt"

permissions:
  contents: write

concurrency:
  group: signed-zh-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/zh-CN'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v4

      - name: Resolve and check version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then version="$(cat .release/TRIGGER_SIGNED_RELEASE.txt)"; fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-zh\.[0-9]+$ ]]; then
            echo "::error::Expected version like 1.4.1-zh.2"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists; do not overwrite released APKs."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require permanent signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing signing secret $key; stable release aborted (no debug-key fallback)."
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/scp-reader-zh-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          ./gradlew assembleRelease --no-daemon \
            -PrequireReleaseSigning=true \
            -PappVersionName="$version" \
            -PappVersionCode="$((100000 + GITHUB_RUN_NUMBER))"

      - name: Verify APK signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          "$apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate SHA-256 digest'
          cp "$apk" "dist/scp-reader-v${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Delete temporary signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/scp-reader-zh-release.p12"

      - name: Publish public stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SCP Reader 简体中文汉化版 v${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          make_latest: true
          body_path: .release/RELEASE_NOTES_STABLE.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

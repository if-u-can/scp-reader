name: Publish Chinese public preview v1.4.1-zh.1

on:
  push:
    branches: [zh-CN]
    paths:
      - ".release/publish-v1.4.1-zh.1.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chinese branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build preview release APK (temporary debug signing)
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=1.4.1-zh.1 \
            -PappVersionCode=10001
      - name: Prepare published APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/scp-reader-v1.4.1-zh.1-preview.apk
          (cd dist && sha256sum scp-reader-v1.4.1-zh.1-preview.apk > SHA256SUMS.txt)
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1-zh.1
          target_commitish: ${{ github.sha }}
          name: SCP Reader 简体中文汉化版 v1.4.1-zh.1
          draft: false
          prerelease: true
          make_latest: false
          body_path: .release/RELEASE_NOTES_v1.4.1-zh.1.md
          files: |
            dist/scp-reader-v1.4.1-zh.1-preview.apk
            dist/SHA256SUMS.txt

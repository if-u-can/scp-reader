name: Build Chinese APK

on:
  push:
    branches: [zh-CN]
  workflow_dispatch:

concurrency:
  group: zh-cn-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test reader conversion (headless, no external services)
        run: ./gradlew testDebugUnitTest --tests "com.foundation.scpreader.data.ReaderScriptConverterTest" --no-daemon
      - name: Build Chinese debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: scp-reader-zh-cn-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
